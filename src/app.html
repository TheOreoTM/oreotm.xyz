<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="alternate" type="application/rss+xml" title="OreoTM's blog" href="/rss.xml" />
		<script>
			// Apply the saved or system theme before first paint to avoid a flash.
			(function () {
				var root = document.documentElement;
				var query = window.matchMedia('(prefers-color-scheme: dark)');
				function saved() {
					try {
						return localStorage.getItem('theme');
					} catch (e) {
						return null;
					}
				}
				root.dataset.theme = saved() || (query.matches ? 'dark' : 'light');
				query.addEventListener('change', function (e) {
					if (!saved()) root.dataset.theme = e.matches ? 'dark' : 'light';
				});
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
